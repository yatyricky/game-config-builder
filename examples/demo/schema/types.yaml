enums:
  ItemQuality:
    comment: 物品品质
    values:
      - { name: White, value: 0 }
      - { name: Green, value: 1 }
      - { name: Blue, value: 2 }
      - { name: Purple, value: 3 }
  Element:
    comment: 伤害元素
    values:
      - { name: Physical, value: 0 }
      - { name: Fire, value: 1 }
      - { name: Water, value: 2 }
      - { name: Wind, value: 3 }

structs:
  RewardItem:
    comment: 奖励项
    fields:
      - { name: itemId, type: 'ref<Item>' }
      - { name: count, type: int, default: 1, range: [1, 9999] }
  DamageParams:
    comment: 伤害效果参数
    fields:
      - { name: power, type: int, range: [0, 999999] }
      - { name: element, type: 'enum<Element>', default: Physical }
  HealParams:
    comment: 治疗效果参数
    fields:
      - { name: heal, type: int, range: [1, 999999] }
      - { name: cure, type: bool, default: false }

unions:
  SkillEffect:
    comment: 技能效果（tag 多态）
    tag: effectType
    variants:
      - { name: Damage, struct: DamageParams }
      - { name: Heal, struct: HealParams }
