<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗黑2 · 技能树沙盒</title>
<style>
  :root{
    --gold:#c9a959; --gold-bright:#ffd76b; --gold-dim:#8a744a;
    --parch:#e8d8ac; --ink:#0d0a06; --panel:#161009; --panel2:#1e1710;
    --line:#3a2d1a; --danger:#c96a5a; --muted:#9a8a68;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#0b0805;color:var(--parch);
    font:14px/1.5 "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  button{font-family:inherit}

  #app{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) 320px;min-height:0}
  aside{background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;flex-direction:column;min-height:0;overflow-y:auto}
  #library{border-right:1px solid var(--line)}
  #inspector{border-left:1px solid var(--line)}

  .brand{padding:14px 12px 12px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:17px;color:var(--gold);letter-spacing:1px;font-family:Georgia,"Times New Roman",serif}
  .brand small{color:var(--muted);font-size:11px}
  .panel-title{padding:12px 12px 6px;font-size:12px;color:var(--gold-dim);letter-spacing:3px}

  .lib-item{display:flex;align-items:center;gap:10px;margin:4px 10px;padding:9px 10px;
    background:#211910;border:1px solid #45341d;border-radius:6px;cursor:pointer;
    color:var(--parch);text-align:left;transition:.15s;width:calc(100% - 20px)}
  .lib-item:hover{border-color:var(--gold);box-shadow:0 0 10px rgba(201,169,89,.25);transform:translateX(2px)}
  .lib-item .ico{font-size:18px;width:22px;text-align:center}
  .lib-item b{display:block;font-size:13px}
  .lib-item small{display:block;color:var(--muted);font-size:11px}
  .lib-note{padding:10px 12px;color:#6f6248;font-size:11.5px;line-height:1.6}

  #stage{position:relative;min-width:0;background:#0b0805;overflow:hidden}
  #canvas{position:absolute;inset:0;display:block}
  #canvas.hovering{cursor:pointer}
  #canvas.dragging{cursor:grabbing}

  #hud{position:absolute;top:14px;right:14px;background:rgba(16,11,6,.9);border:1px solid var(--line);
    border-radius:8px;padding:10px 16px 10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.5);user-select:none}
  #hud .lv{font-size:11px;color:var(--muted);letter-spacing:2px}
  #hud .lv b{display:block;font-size:28px;color:var(--gold-bright);font-family:Georgia,serif;line-height:1.1}
  #hud .sub{font-size:11.5px;color:#b7a67c;margin-top:2px}
  #hud .hud-btns{display:flex;gap:6px;margin-top:8px}
  #hud .btn{font-size:12px;padding:4px 10px}
  #hud .hud-gift{width:46px;margin-left:4px;background:#0f0b06;border:1px solid #453619;border-radius:4px;
    color:var(--gold-bright);text-align:center;font:12px/1.4 Consolas,"Courier New",monospace;padding:2px;outline:none;vertical-align:middle}
  #hud .hud-gift:focus{border-color:var(--gold)}

  #hint{position:absolute;left:14px;bottom:12px;color:#8a7a58;font-size:12px;
    background:rgba(11,8,5,.72);padding:4px 12px;border-radius:6px;pointer-events:none}

  #toasts{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;gap:6px;z-index:30;pointer-events:none}
  .toast{background:rgba(20,14,7,.95);border:1px solid var(--gold-dim);color:var(--parch);
    padding:7px 16px;border-radius:6px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.55);
    animation:toastIn .18s ease;white-space:nowrap}
  .toast.warn{border-color:#a05a3f;color:#ffce9e}
  .toast.err{border-color:#a04033;color:#ffb0a0}
  .toast.out{opacity:0;transition:opacity .4s}
  @keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}

  #tooltip{position:absolute;display:none;max-width:270px;background:rgba(14,10,5,.97);
    border:1px solid var(--gold-dim);border-radius:8px;padding:10px 12px;font-size:12.5px;
    pointer-events:none;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.65)}
  #tooltip .tt-name{color:var(--gold-bright);font-size:14px;margin-bottom:2px}
  #tooltip .tt-id{color:#7a6a48;font-size:11px;margin-left:6px}
  #tooltip .tt-desc{color:#c9b98d;margin:2px 0 6px;border-bottom:1px solid #3a2d1a;padding-bottom:6px}
  #tooltip .tt-row{margin:2px 0;color:#cbbc93}
  #tooltip .tt-row .dim{color:#7a6a48}
  #tooltip .tt-status{margin-top:6px;padding-top:5px;border-top:1px solid #3a2d1a;font-weight:bold}

  /* ---------- Inspector ---------- */
  #inspHead{padding:14px 12px 10px;border-bottom:1px solid var(--line)}
  #inspHead h2{margin:0;font-size:15px;color:var(--gold);letter-spacing:2px;font-family:Georgia,serif}
  #inspEmpty{padding:34px 16px;text-align:center;color:#7a6a48;font-size:13px;line-height:1.9}
  .field{padding:5px 12px}
  .field label{display:block;font-size:11.5px;color:var(--gold-dim);letter-spacing:1px;margin-bottom:3px}
  .field input[type=text],.field input[type=number],.field select,.field textarea{
    width:100%;background:#0f0b06;border:1px solid #453619;border-radius:5px;color:var(--parch);
    padding:6px 8px;font:13px/1.4 inherit;font-family:inherit;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 6px rgba(201,169,89,.25)}
  .field input:disabled,.field select:disabled{opacity:.45;cursor:not-allowed}
  .field textarea{resize:vertical;min-height:60px}
  .field input[type=number]{width:100%}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px 12px}
  .row2 .field{padding:0}
  .divider{height:1px;background:var(--line);margin:9px 12px}
  #iconPreview{max-width:100%;max-height:64px;margin-top:5px;border:1px solid var(--line);
    border-radius:4px;background:#0f0b06;padding:3px;display:block}
  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 12px 6px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:#2a2012;border:1px solid #4c3b1f;
    border-radius:20px;padding:2px 4px 2px 10px;font-size:12px;color:var(--parch)}
  .chip i{color:#7a6a48;font-style:normal;font-size:11px}
  .chip button{background:none;border:none;color:#c98a6a;cursor:pointer;font-size:13px;padding:0 4px;line-height:1}
  .chip button:hover{color:#ff9d85}
  .req-add{display:flex;gap:6px;padding:2px 12px 6px}
  .req-add input{flex:1;background:#0f0b06;border:1px solid #453619;border-radius:5px;color:var(--parch);
    padding:6px 8px;font:12.5px inherit;font-family:inherit;outline:none}
  #inspFoot{margin-top:auto;padding:12px;display:flex;gap:8px}
  #inspFoot .btn{flex:1}
  .btn{background:linear-gradient(180deg,#2b2113,#1d1509);border:1px solid var(--gold-dim);color:var(--gold);
    padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;letter-spacing:1px;transition:.15s}
  .btn:hover:not(:disabled){border-color:var(--gold-bright);color:var(--gold-bright);box-shadow:0 0 10px rgba(255,215,107,.25)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.primary{background:linear-gradient(180deg,#4a3818,#33260f);border-color:var(--gold)}
  .btn.danger{border-color:#7a4033;color:#e0896f}
  .btn.danger:hover:not(:disabled){border-color:#c96a5a;color:#ff9d85;box-shadow:0 0 10px rgba(201,106,90,.3)}
  #inspPtsVal{color:var(--gold-bright);font-weight:bold}

  /* ---------- 数据栏 ---------- */
  #databar{border-top:2px solid #4a3820;background:var(--panel);display:flex;flex-direction:column;height:210px;flex:none}
  #dbarHead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
  #dbarHead .title{color:var(--gold);letter-spacing:3px;font-size:13px}
  .spacer{flex:1}
  #jsonView{flex:1;width:100%;background:#0d0a05;color:#cfc09a;border:none;outline:none;
    padding:10px 14px;font:12px/1.55 Consolas,"Courier New",monospace;resize:none}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#3a2d1a;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#4f3d24}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<div id="app">
  <!-- 左侧：控件库 -->
  <aside id="library">
    <div class="brand">
      <h1>☠ 技能树沙盒</h1>
      <small>Diablo II-like Sandbox</small>
    </div>
    <div class="panel-title">控件库</div>
    <div id="libList"></div>
    <div class="lib-note">点击左侧控件，在画布中央生成一个新的技能节点。<br>生成后可在右侧 Inspector 中编辑属性。</div>
  </aside>

  <!-- 中间：画布 -->
  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div class="lv">玩家等级 <b id="hudLevel">1</b></div>
      <div class="sub">可用天赋点 <b id="hudPts" style="color:var(--gold-bright)">1</b></div>
      <div class="sub">默认赠送天赋点 <input type="number" id="hudGift" class="hud-gift" min="0" max="999" step="1" value="1" title="初始与重置时赠送的天赋点数量；修改后立即生效"></div>
      <div class="sub">已点亮 <span id="hudLit">0</span> / <span id="hudTotal">0</span> 个技能</div>
      <div class="hud-btns">
        <button class="btn" id="btnLevelUp" title="等级 +1，并获得 1 天赋点">升级</button>
        <button class="btn" id="btnGrant" title="特殊任务奖励：获得 1 天赋点">送天赋</button>
        <button class="btn" id="btnReset" title="回到初始：等级 1 / 天赋点 1 / 节点全部清零">重置</button>
      </div>
    </div>
    <div id="tooltip"></div>
    <div id="toasts"></div>
    <div id="hint">中键：打开 Inspector · 左键：加点 · 右键：减 1 点 · 拖动：移动节点（网格吸附）· Delete：删除选中 · 点击空白：取消选中</div>
  </main>

  <!-- 右侧：Inspector -->
  <aside id="inspector">
    <div id="inspHead"><h2>检查器 · Inspector</h2></div>
    <div id="inspEmpty">未选中节点<br><small>中键点击画布中的技能节点进行查看与编辑</small></div>
    <div id="inspForm" hidden>
      <div class="field">
        <label>ID</label>
        <input type="text" id="inspId" spellcheck="false">
      </div>
      <div class="field">
        <label>图标（URL，留空则显示名称）</label>
        <input type="text" id="inspIcon" spellcheck="false" placeholder="https://… 或 data:image/…">
        <img id="iconPreview" alt="" hidden>
      </div>
      <div class="field">
        <label>名称</label>
        <input type="text" id="inspName" spellcheck="false">
      </div>
      <div class="field">
        <label>节点说明</label>
        <textarea id="inspDesc" spellcheck="false"></textarea>
      </div>
      <div class="field">
        <label>节点形状</label>
        <select id="inspShape">
          <option value="rect">圆角矩形</option>
          <option value="circle">圆形</option>
        </select>
      </div>
      <div class="row2">
        <div class="field">
          <label>需求等级</label>
          <input type="number" id="inspReqLevel" min="0" max="99" step="1">
        </div>
        <div class="field">
          <label>最大可点等级</label>
          <input type="number" id="inspMaxLevel" min="1" max="99" step="1">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>跳级要求</label>
          <input type="number" id="inspSkip" min="0" max="99" step="1" title="升下一级需跳过的玩家等级数：1=每级间隔2级（如需求等级1的五级对应玩家等级1/3/5/7/9），0=不跳级">
        </div>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--parch)">
          <input type="checkbox" id="inspAutoUnlock" style="width:auto;accent-color:#c9a959">
          自动解锁
        </label>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label>当前点数</label>
        <div>
          <span id="inspPtsVal">0 / 1</span>
          <button class="btn" id="inspAdd" style="padding:2px 10px;margin-left:8px">+1 点</button>
          <button class="btn" id="inspSub" style="padding:2px 10px">−1 点</button>
        </div>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label>需求前置技能 ID</label>
        <div class="chips" id="inspChips"></div>
        <div class="req-add">
          <input type="text" id="inspReqInput" list="idList" spellcheck="false" placeholder="输入前置技能 id…">
          <datalist id="idList"></datalist>
          <button class="btn" id="inspReqAdd" style="padding:4px 12px">添加</button>
        </div>
      </div>
      <div id="inspFoot">
        <button class="btn danger" id="inspDelete">✕ 删除节点</button>
      </div>
    </div>
  </aside>
</div>

<!-- 底部：数据 -->
<footer id="databar">
  <div id="dbarHead">
    <span class="title">画布 JSON</span>
    <span class="spacer"></span>
    <button class="btn primary" id="btnSave">⬇ 保存 JSON</button>
    <button class="btn" id="btnUpload">⬆ 上传 JSON</button>
    <button class="btn" id="btnApply">✓ 应用文本框</button>
  </div>
  <textarea id="jsonView" spellcheck="false"></textarea>
</footer>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

// ================= DOM =================
const stage    = document.getElementById('stage');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const tooltip  = document.getElementById('tooltip');
const toasts   = document.getElementById('toasts');
const hudLevel = document.getElementById('hudLevel');
const hudPts   = document.getElementById('hudPts');
const hudGift  = document.getElementById('hudGift');
const hudLit   = document.getElementById('hudLit');
const hudTotal = document.getElementById('hudTotal');
const jsonView = document.getElementById('jsonView');
const fileInput= document.getElementById('fileInput');

const inspForm  = document.getElementById('inspForm');
const inspEmpty = document.getElementById('inspEmpty');
const inspId    = document.getElementById('inspId');
const inspIcon  = document.getElementById('inspIcon');
const iconPreview = document.getElementById('iconPreview');
const inspName  = document.getElementById('inspName');
const inspDesc  = document.getElementById('inspDesc');
const inspShape = document.getElementById('inspShape');
const inspReqLevel = document.getElementById('inspReqLevel');
const inspMaxLevel = document.getElementById('inspMaxLevel');
const inspSkip = document.getElementById('inspSkip');
const inspAutoUnlock = document.getElementById('inspAutoUnlock');
const inspPtsVal= document.getElementById('inspPtsVal');
const inspAdd   = document.getElementById('inspAdd');
const inspSub   = document.getElementById('inspSub');
const inspChips = document.getElementById('inspChips');
const inspReqInput = document.getElementById('inspReqInput');
const inspReqAdd= document.getElementById('inspReqAdd');
const idList    = document.getElementById('idList');
const inspDelete= document.getElementById('inspDelete');

const DPR = Math.max(1, window.devicePixelRatio || 1);
const NODE_W = 88, NODE_H = 88;
const GRID = 44; // 网格吸附间距（与背景点阵同节奏：点在 22+44k，节点中心吸到点上）
const snapGrid = v => Math.max(GRID / 2, 22 + Math.round((v - 22) / GRID) * GRID);

// ================= 状态 =================
const state = {
  nodes: [],        // {id,icon,name,desc,shape,skip,autoUnlock,reqLevel,maxLevel,reqSkills[],x,y,points}
  playerLevel: 1,   // 玩家等级（右上角"升级"按钮提升，不随加点变化）
  talentPoints: 1,  // 可用天赋点（初始送 1；升级/送天赋获得，加点消耗）
  selectedId: null,
  hoverId: null,
  mouse: {x:0, y:0},
  drag: null,       // {id,dx,dy,moved,startX,startY}
  flashUntil: new Map(), // id -> timestamp（加点失败时红闪）
};

const nodeById = id => state.nodes.find(n => n.id === id);
const selNode  = () => state.selectedId ? nodeById(state.selectedId) : null;
// 玩家等级与天赋点是独立资源：升级按钮/送天赋按钮是唯一来源，加点不改变等级
const playerLevel = () => state.playerLevel;
// 升该节点下一点所需的玩家等级（跳级要求 = 升下一级需跳过 skip 个等级，即步进 skip+1；0=无跳级）
function nextLevelReq(n){
  const step = n.skip > 0 ? n.skip + 1 : 0;
  return n.reqLevel + n.points * step;
}

function uniqueId(base){
  let i = 1;
  while (state.nodes.some(n => n.id === base + '_' + i)) i++;
  return base + '_' + i;
}

// 加点规则：自动解锁节点不可手动加点；普通节点=等级匹配（含跳级要求）+ 前置至少 1 点
function canPick(n){
  if (n.autoUnlock) return playerLevel() >= n.reqLevel;
  const lv = playerLevel();
  if (lv < nextLevelReq(n)) return false;
  return n.reqSkills.every(id => (nodeById(id)?.points ?? 0) >= 1);
}
function blockReason(n){
  if (n.autoUnlock) return '自动解锁节点：玩家等级达到需求等级后自动点亮';
  if (n.points >= n.maxLevel) return '已达到最大等级';
  if (state.talentPoints <= 0) return '天赋点不足';
  const lv = playerLevel();
  const need = nextLevelReq(n);
  if (lv < need) return `需求等级 ${need}（当前 ${lv}）`;
  const unmet = n.reqSkills
    .filter(id => (nodeById(id)?.points ?? 0) < 1)
    .map(id => nodeById(id)?.name ?? id);
  if (unmet.length) return '前置未满足：' + unmet.join('、');
  return null;
}
function tryAllocate(n){
  const reason = blockReason(n);
  if (reason){
    state.flashUntil.set(n.id, performance.now() + 500);
    toast(`无法点亮「${n.name}」：${reason}`, 'warn');
    return;
  }
  n.points++;
  state.talentPoints--;
  refreshAll();
}
function removePoint(n){
  if (n.autoUnlock){ toast('自动解锁节点，无法取消点亮', 'warn'); return; }
  if (n.points > 0){ n.points--; state.talentPoints++; refreshAll(); } // 天赋点退回池中
}

// ================= 控件库 =================
const LIB_PRESETS = [
  { icon:'⬡', label:'空白技能', sub:'通用节点', make:() => ({ name:'新技能', desc:'', maxLevel:5, reqLevel:0 }) },
  { icon:'⚔️', label:'主动技能', sub:'消耗资源发动', make:() => ({ name:'新主动技能', desc:'消耗法力发动的攻击技能。', maxLevel:5, reqLevel:0 }) },
  { icon:'✦', label:'被动技能', sub:'永久生效', make:() => ({ name:'新被动技能', desc:'永久生效的被动强化。', maxLevel:10, reqLevel:0 }) },
  { icon:'☄️', label:'终极技能', sub:'需求等级 6 · 上限 1', make:() => ({ name:'终极技能', desc:'威力强大的最终技能。', maxLevel:1, reqLevel:6 }) },
];
function buildLibrary(){
  const list = document.getElementById('libList');
  for (const p of LIB_PRESETS){
    const btn = document.createElement('button');
    btn.className = 'lib-item';
    btn.innerHTML = `<span class="ico">${p.icon}</span><span><b>${p.label}</b><small>${p.sub}</small></span>`;
    btn.addEventListener('click', () => spawnNode(p));
    list.appendChild(btn);
  }
}
// 在画布可视范围内找空位：把画布按节点尺寸（含下方标签）划分网格，
// 从中心格按距离取最近的未占用格，保证新节点永远不会落到可视范围外
function findSpawnSpot(taken){
  const r = stage.getBoundingClientRect();
  const takenKeys = new Set((taken || state.nodes).map(n => Math.round(n.x) + ',' + Math.round(n.y)));
  const cols = Math.max(1, Math.floor((r.width - 24) / (NODE_W + 12)));
  const rows = Math.max(1, Math.floor((r.height - 76) / (NODE_H + 56)));
  const cc = (cols - 1) / 2, cr = (rows - 1) / 2;
  let best = null, bestD = Infinity;
  for (let row = 0; row < rows; row++){
    for (let col = 0; col < cols; col++){
      const x = snapGrid(12 + NODE_W / 2 + col * (NODE_W + 12));
      const y = snapGrid(44 + NODE_H / 2 + row * (NODE_H + 56));
      if (takenKeys.has(x + ',' + y)) continue;
      const d = (col - cc) ** 2 + (row - cr) ** 2;
      if (d < bestD){ bestD = d; best = { x, y }; }
    }
  }
  return best || { x: snapGrid(r.width / 2), y: snapGrid(r.height / 2) }; // 格子用尽时允许重叠，但仍在可视范围内
}
function spawnNode(preset){
  const base = preset.make();
  const p = findSpawnSpot(state.nodes);
  const n = {
    id: uniqueId('skill'),
    ...base,
    icon: base.icon || '',
    desc: base.desc || '',
    shape: 'rect',
    skip: 0,
    autoUnlock: false,
    reqSkills: [],
    points: 0,
    x: p.x,
    y: p.y,
  };
  state.nodes.push(n);
  select(n.id);
  refreshAll();
  toast(`已在画布生成「${n.name}」`);
}

// ================= Canvas 尺寸 =================
function resize(){
  const r = stage.getBoundingClientRect();
  canvas.width  = Math.max(1, Math.round(r.width * DPR));
  canvas.height = Math.max(1, Math.round(r.height * DPR));
  canvas.style.width  = r.width + 'px';
  canvas.style.height = r.height + 'px';
}
window.addEventListener('resize', resize);

// ================= 图标缓存 =================
const iconCache = new Map(); // url -> {img, ok, failed}
function iconEntry(url){
  if (!url) return null;
  let e = iconCache.get(url);
  if (!e){
    e = { img: new Image(), ok: false, failed: false };
    e.img.onload  = () => { e.ok = true; };
    e.img.onerror = () => { e.failed = true; };
    e.img.src = url;
    iconCache.set(url, e);
  }
  return e;
}

// ================= 视觉状态 =================
const THEMES = {
  locked:  { border:'#57493a', fill:'#1b1611', name:'#93876f', pts:'#8d8272', glow:0,  glowColor:'' },
  avail:   { border:'#c8a557', fill:'#231b10', name:'#e4d4a8', pts:'#cdb277', glow:7,  glowColor:'rgba(201,169,89,.5)' },
  partial: { border:'#ecd28b', fill:'#2b2213', name:'#f0e2b6', pts:'#ecd28b', glow:10, glowColor:'rgba(236,210,139,.55)' },
  maxed:   { border:'#ffd76b', fill:'#33270f', name:'#ffe9b0', pts:'#ffd76b', glow:14, glowColor:'rgba(255,215,107,.7)' },
};
function vstate(n){
  if (n.points >= n.maxLevel) return 'maxed';
  if (n.points > 0) return 'partial';
  return canPick(n) ? 'avail' : 'locked';
}

// ================= 绘制 =================
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 节点外形路径：circle=内切圆，否则圆角矩形
function shapePath(shape, x, y, w, h){
  if (shape === 'circle'){
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) / 2, 0, Math.PI * 2);
    ctx.closePath();
  } else {
    roundRect(x, y, w, h, 10);
  }
}
function edgeToward(n, other){
  const hw = NODE_W / 2 + 4, hh = NODE_H / 2 + 4;
  const dx = other.x - n.x, dy = other.y - n.y;
  if (!dx && !dy) return { x:n.x, y:n.y - hh };
  if (n.shape === 'circle'){
    // 圆形：到边缘距离各向同性（hw=hh=半径+4）
    const len = Math.hypot(dx, dy);
    return { x: n.x + dx / len * hw, y: n.y + dy / len * hh };
  }
  const sx = dx ? hw / Math.abs(dx) : Infinity;
  const sy = dy ? hh / Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: n.x + dx * s, y: n.y + dy * s };
}
function drawArrow(a, b){
  const sat = a.points >= 1;
  const p1 = edgeToward(a, b), p2 = edgeToward(b, a);
  ctx.save();
  ctx.strokeStyle = sat ? '#d9b25c' : '#5f4f39';
  ctx.lineWidth = sat ? 2.5 : 1.6;
  if (sat){ ctx.shadowColor = 'rgba(217,178,92,.6)'; ctx.shadowBlur = 6; }
  else ctx.setLineDash([7, 6]);
  ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  ctx.setLineDash([]); ctx.shadowBlur = 0;
  const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x), hl = 11;
  ctx.fillStyle = sat ? '#e6c36a' : '#6b5940';
  ctx.beginPath();
  ctx.moveTo(p2.x, p2.y);
  ctx.lineTo(p2.x - hl * Math.cos(ang - 0.44), p2.y - hl * Math.sin(ang - 0.44));
  ctx.lineTo(p2.x - hl * Math.cos(ang + 0.44), p2.y - hl * Math.sin(ang + 0.44));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function wrapText(text, maxW, maxLines){
  const chars = [...String(text)];
  const lines = []; let line = '';
  ctx.font = '12px "Microsoft YaHei","PingFang SC",sans-serif';
  for (const ch of chars){
    if (line && ctx.measureText(line + ch).width > maxW){ lines.push(line); line = ch; if (lines.length === maxLines) break; }
    else line += ch;
  }
  if (lines.length < maxLines && line) lines.push(line);
  if (lines.length === maxLines && (lines[maxLines-1].length < [...String(text)].length || (lines.length === maxLines && line && lines[lines.length-1] === line && lines.join('').length < [...String(text)].length))){
    lines[maxLines-1] = lines[maxLines-1].slice(0, -1) + '…';
  }
  return lines.length ? lines : [''];
}
function drawNode(n, t){
  const st = vstate(n);
  const th = THEMES[st];
  const flash = (state.flashUntil.get(n.id) || 0) > t;
  const x = n.x - NODE_W / 2, y = n.y - NODE_H / 2;

  ctx.save();
  // 底板 + 阴影
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  ctx.fillStyle = th.fill;
  shapePath(n.shape, x, y, NODE_W, NODE_H); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // 边框（可点亮 / 满级带光晕）
  ctx.lineWidth = n.id === state.hoverId ? 3 : 2;
  if (th.glow){
    const pulse = st === 'maxed' ? Math.sin(t / 280) * 3 + 4 : 0;
    ctx.shadowColor = th.glowColor; ctx.shadowBlur = th.glow + pulse;
  }
  ctx.strokeStyle = flash ? '#ff5a4e' : th.border;
  shapePath(n.shape, x, y, NODE_W, NODE_H); ctx.stroke();
  ctx.shadowBlur = 0;

  // 选中描边
  if (n.id === state.selectedId){
    ctx.lineWidth = 2; ctx.strokeStyle = '#ffe9a8';
    shapePath(n.shape, x - 5, y - 5, NODE_W + 10, NODE_H + 10); ctx.stroke();
  }

  // 图标 / 名称（图标缺失时显示名称）
  const entry = iconEntry(n.icon);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (entry && entry.ok){
    if (st === 'locked'){ try { ctx.filter = 'grayscale(85%) brightness(0.75)'; } catch(_){} }
    const s = Math.min(56 / entry.img.width, 56 / entry.img.height);
    const dw = entry.img.width * s, dh = entry.img.height * s;
    ctx.drawImage(entry.img, n.x - dw / 2, n.y - dh / 2, dw, dh);
    try { ctx.filter = 'none'; } catch(_){}
  } else {
    ctx.fillStyle = th.name;
    const lines = wrapText(n.name || '未命名', NODE_W - 18, 3);
    const lh = 16, y0 = n.y - (lines.length - 1) * lh / 2;
    lines.forEach((L, i) => ctx.fillText(L, n.x, y0 + i * lh));
  }

  // 名称 + 点数标签
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 4;
  ctx.font = '13px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.fillStyle = th.name;
  ctx.fillText(n.name || '未命名', n.x, y + NODE_H + 15);
  ctx.font = 'bold 13px Consolas,"Courier New",monospace';
  ctx.fillStyle = flash ? '#ff7a6e' : th.pts;
  ctx.fillText(`${n.points} / ${n.maxLevel}`, n.x, y + NODE_H + 32);
  ctx.restore();
}
function draw(t){
  const w = canvas.width / DPR, h = canvas.height / DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 背景
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#191207'); g.addColorStop(1, '#0b0805');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // 背景点阵（即网格吸附参照线，节点中心吸附到点上）
  ctx.fillStyle = 'rgba(232,203,138,0.09)';
  for (let gx = 22; gx < w; gx += 44)
    for (let gy = 22; gy < h; gy += 44) ctx.fillRect(gx, gy, 1.5, 1.5);
  const v = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*.35, w/2, h/2, Math.max(w,h)*.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);
  // 箭头（依赖关系）
  for (const n of state.nodes)
    for (const rid of n.reqSkills){
      const s = nodeById(rid);
      if (s) drawArrow(s, n);
    }
  // 节点（选中的最后画，置顶）
  for (const n of state.nodes) if (n.id !== state.selectedId) drawNode(n, t);
  const sn = nodeById(state.selectedId);
  if (sn) drawNode(sn, t);
}
(function loop(t){ draw(t || 0); requestAnimationFrame(loop); })();

// ================= 交互 =================
function mousePos(e){ return { x: e.offsetX, y: e.offsetY }; }
function hitNode(x, y){
  for (let i = state.nodes.length - 1; i >= 0; i--){
    const n = state.nodes[i];
    if (n.shape === 'circle'){
      const dx = x - n.x, dy = y - n.y;
      if (dx * dx + dy * dy <= (NODE_W / 2 + 3) ** 2) return n;
    } else if (Math.abs(x - n.x) <= NODE_W/2 + 3 && Math.abs(y - n.y) <= NODE_H/2 + 3) return n;
  }
  return null;
}
canvas.addEventListener('mousedown', e => {
  const p = mousePos(e);
  const n = hitNode(p.x, p.y);
  if (e.button === 1){
    e.preventDefault(); // 阻止中键自动滚动
    if (n) select(n.id); // 中键：打开 Inspector
  } else if (e.button === 0 && n){
    state.drag = { id: n.id, dx: p.x - n.x, dy: p.y - n.y, moved: false, startX: p.x, startY: p.y };
  } else if (e.button === 0){
    state.selectedId = null; // 点击空白：取消选中
    refreshInspector();
  } else if (e.button === 2 && n){
    removePoint(n);
  }
});
canvas.addEventListener('mousemove', e => {
  const p = mousePos(e);
  state.mouse = p;
  if (state.drag){
    const d = state.drag;
    if (!d.moved && Math.hypot(p.x - d.startX, p.y - d.startY) > 4){
      d.moved = true;
      canvas.classList.add('dragging');
      tooltip.style.display = 'none';
    }
    if (d.moved){
      const n = nodeById(d.id);
      if (n){ n.x = snapGrid(p.x - d.dx); n.y = snapGrid(p.y - d.dy); refreshJson(); }
    }
    return;
  }
  const n = hitNode(p.x, p.y);
  state.hoverId = n ? n.id : null;
  canvas.classList.toggle('hovering', !!n);
  updateTooltip(p);
});
window.addEventListener('mouseup', e => {
  if (e.button !== 0 || !state.drag) return;
  const d = state.drag;
  state.drag = null;
  canvas.classList.remove('dragging');
  if (!d.moved){
    const n = nodeById(d.id);
    if (n){ select(n.id); tryAllocate(n); }
  }
});
canvas.addEventListener('mouseleave', () => {
  state.hoverId = null;
  canvas.classList.remove('hovering');
  tooltip.style.display = 'none';
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedId){
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
    e.preventDefault();
    deleteNode(state.selectedId);
  }
});

// ================= 悬停提示 =================
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function updateTooltip(p){
  const n = state.hoverId ? nodeById(state.hoverId) : null;
  if (!n){ tooltip.style.display = 'none'; return; }
  const lv = playerLevel();
  const need = nextLevelReq(n);
  const lvOk = lv >= need;
  const parts = [];
  parts.push(`<div class="tt-name">${esc(n.name || '未命名')}<span class="tt-id">#${esc(n.id)}</span></div>`);
  if (n.desc) parts.push(`<div class="tt-desc">${esc(n.desc)}</div>`);
  parts.push(`<div class="tt-row">点数 <b style="color:#ffd76b">${n.points} / ${n.maxLevel}</b></div>`);
  parts.push(`<div class="tt-row">下一点需求等级 <b style="color:${lvOk ? '#9fd78a' : '#ff8d7e'}">${need}</b><span class="dim">（当前 ${lv}${n.skip > 0 ? ' · 跳级' + n.skip : ''}）</span></div>`);
  if (n.reqSkills.length){
    const items = n.reqSkills.map(id => {
      const s = nodeById(id);
      const ok = (s?.points ?? 0) >= 1;
      return `<span style="color:${ok ? '#9fd78a' : '#ff8d7e'}">${ok ? '✓' : '✗'} ${esc(s ? s.name : id)}</span>`;
    }).join('　');
    parts.push(`<div class="tt-row">前置 ${items}</div>`);
  }
  const reason = blockReason(n);
  const status = n.autoUnlock
    ? (n.points > 0
        ? '✔ 已自动点亮（不耗天赋点）'
        : '🔒 自动解锁：玩家等级达到 ' + n.reqLevel + ' 后自动点亮')
    : (reason ? '🔒 ' + esc(reason) : '✔ 可点亮');
  parts.push(`<div class="tt-status" style="color:${(n.autoUnlock ? n.points <= 0 : !!reason) ? '#ff8d7e' : '#ffd76b'}">${status}</div>`);
  tooltip.innerHTML = parts.join('');
  tooltip.style.display = 'block';
  const r = stage.getBoundingClientRect();
  let tx = p.x + 18, ty = p.y + 18;
  if (tx + tooltip.offsetWidth  > r.width  - 8) tx = p.x - tooltip.offsetWidth  - 16;
  if (ty + tooltip.offsetHeight > r.height - 8) ty = p.y - tooltip.offsetHeight - 16;
  tooltip.style.left = Math.max(4, tx) + 'px';
  tooltip.style.top  = Math.max(4, ty) + 'px';
}

// ================= Toast =================
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  toasts.appendChild(el);
  setTimeout(() => el.classList.add('out'), 2200);
  setTimeout(() => el.remove(), 2700);
}

// ================= Inspector =================
function select(id){ state.selectedId = id; refreshInspector(); }
function refreshInspector(){
  const n = selNode();
  inspForm.hidden = !n;
  inspEmpty.style.display = n ? 'none' : 'block';
  if (!n) return;
  inspId.value = n.id;
  inspIcon.value = n.icon;
  if (n.icon){ iconPreview.src = n.icon; iconPreview.hidden = false; }
  else iconPreview.hidden = true;
  inspName.value = n.name;
  inspDesc.value = n.desc;
  inspShape.value = n.shape || 'rect';
  inspReqLevel.value = n.reqLevel;
  inspMaxLevel.value = n.maxLevel;
  inspSkip.value = n.skip || 0;
  inspAutoUnlock.checked = !!n.autoUnlock;
  // 自动解锁节点不使用最大可点等级/跳级要求，字段置灰；也不可手动加减点
  inspMaxLevel.disabled = !!n.autoUnlock;
  inspSkip.disabled = !!n.autoUnlock;
  const reason = blockReason(n);
  inspPtsVal.textContent = `${n.points} / ${n.maxLevel}`;
  inspAdd.disabled = !!reason;
  inspAdd.title = reason || '点亮 1 级';
  inspSub.disabled = n.points <= 0 || !!n.autoUnlock;
  // 前置列表 chips
  inspChips.innerHTML = '';
  if (!n.reqSkills.length){
    inspChips.innerHTML = '<span style="color:#6f6248;font-size:12px">（无前置）</span>';
  }
  for (const rid of n.reqSkills){
    const chip = document.createElement('span');
    chip.className = 'chip';
    const s = nodeById(rid);
    chip.innerHTML = `<span>${esc(s ? s.name : rid)}</span><i>#${esc(rid)}</i>`;
    const x = document.createElement('button');
    x.textContent = '✕'; x.title = '移除该前置';
    x.addEventListener('click', () => {
      n.reqSkills = n.reqSkills.filter(id => id !== rid);
      refreshAll();
    });
    chip.appendChild(x);
    inspChips.appendChild(chip);
  }
  // datalist：除自身外的所有 id
  idList.innerHTML = '';
  for (const m of state.nodes){
    if (m.id === n.id) continue;
    const opt = document.createElement('option');
    opt.value = m.id; opt.label = m.name;
    idList.appendChild(opt);
  }
}
function commitId(){
  const n = selNode(); if (!n) return;
  let v = inspId.value.trim();
  if (!v) v = n.id;
  while (v !== n.id && nodeById(v)) v += '_2';
  const old = n.id;
  n.id = v;
  if (old !== v){
    for (const m of state.nodes) m.reqSkills = m.reqSkills.map(id => id === old ? v : id);
    state.selectedId = v;
    toast(`ID 已改为「${v}」，关联引用已同步`);
  }
  inspId.value = v;
  refreshAll();
}
inspId.addEventListener('change', commitId);
inspId.addEventListener('blur', commitId);
inspId.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); inspId.blur(); } });
inspIcon.addEventListener('input', () => {
  const n = selNode(); if (!n) return;
  n.icon = inspIcon.value.trim();
  if (n.icon){ iconPreview.src = n.icon; iconPreview.hidden = false; }
  else iconPreview.hidden = true;
  refreshJson();
});
inspName.addEventListener('input', () => {
  const n = selNode(); if (!n) return;
  n.name = inspName.value.trim() || '未命名';
  refreshJson();
});
inspDesc.addEventListener('input', () => {

  refreshJson();
});
inspShape.addEventListener('change', () => {

});
inspAutoUnlock.addEventListener('change', () => {
  const n = selNode(); if (!n) return;
  n.autoUnlock = inspAutoUnlock.checked;
  if (!n.autoUnlock) n.points = 0; // 取消自动解锁：系统点亮状态收回，回到普通手动节点
  refreshAll(); // 勾选时按当前玩家等级立即点亮/熄灭
});
function clampInt(v, min, max, dft){
  v = parseInt(v, 10);
  if (isNaN(v)) v = dft;
  return Math.min(max, Math.max(min, v));
}
function commitReqLevel(){
  const n = selNode(); if (!n) return;
  n.reqLevel = clampInt(inspReqLevel.value, 0, 99, 0);
  inspReqLevel.value = n.reqLevel;
  refreshAll();
}
function commitMaxLevel(){

  n.points = Math.min(n.points, n.maxLevel);
  inspMaxLevel.value = n.maxLevel;

}
inspReqLevel.addEventListener('change', commitReqLevel);
inspReqLevel.addEventListener('blur', commitReqLevel);
inspReqLevel.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); inspReqLevel.blur(); } });
inspMaxLevel.addEventListener('change', commitMaxLevel);
inspMaxLevel.addEventListener('blur', commitMaxLevel);
inspMaxLevel.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); inspMaxLevel.blur(); } });
function commitSkip(){

}
inspSkip.addEventListener('change', commitSkip);

inspSkip.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); inspSkip.blur(); } });
inspAdd.addEventListener('click', () => { const n = selNode(); if (n) tryAllocate(n); });
inspSub.addEventListener('click', () => { const n = selNode(); if (n) removePoint(n); });

function addReq(){
  const n = selNode(); if (!n) return;

  if (v === n.id)             toast('不能依赖自身', 'warn');

  else if (n.reqSkills.includes(v)) toast('该前置已存在', 'warn');
  else { n.reqSkills.push(v); inspReqInput.value = ''; refreshAll(); }
}
function deleteNode(id){
  const n = nodeById(id);

  state.nodes = state.nodes.filter(m => m.id !== id);

}

});
document.getElementById('btnReset').addEventListener('click', () => {
  state.nodes.forEach(n => n.points = 0);
  state.playerLevel = 1;
  state.talentPoints = readGiftDefault(); // 重置按"默认赠送天赋点"设置
  refreshAll();
  toast(`已重置：等级 1 / 天赋点 ${state.talentPoints}`);
});

// ================= 数据面板 =================
function exportData(){
  return {
    version: 1,
    playerLevel: state.playerLevel,
    talentPoints: state.talentPoints,
    nodes: state.nodes.map(n => ({
      id: n.id, icon: n.icon, name: n.name, desc: n.desc,
      shape: n.shape || 'rect',
      reqLevel: n.reqLevel, maxLevel: n.maxLevel, skip: n.skip || 0, autoUnlock: !!n.autoUnlock,
      reqSkills: [...n.reqSkills],
      x: Math.round(n.x), y: Math.round(n.y), points: n.points,
    })),
  };
}
function refreshJson(){ jsonView.value = JSON.stringify(exportData(), null, 2); }
function refreshHud(){
  hudLevel.textContent = state.playerLevel;
  hudPts.textContent = state.talentPoints;
  hudLit.textContent = state.nodes.filter(n => n.points > 0).length;
  hudTotal.textContent = state.nodes.length;
}
function refreshTooltipIfVisible(){
  if (tooltip.style.display !== 'none' && state.hoverId) updateTooltip(state.mouse);
}
function refreshAll(){
  syncAutoNodes(); // 自动解锁节点随玩家等级即时点亮/熄灭（不耗天赋点）
  refreshHud();
  refreshInspector();
  refreshJson();
  refreshTooltipIfVisible();
}
// 自动解锁节点：忽略最大可点等级与跳级要求，等级达标即整体点亮，否则熄灭；不走天赋点池
function syncAutoNodes(){
  for (const n of state.nodes){
    if (!n.autoUnlock) continue;
    const target = state.playerLevel >= n.reqLevel ? n.maxLevel : 0;
    if (n.points !== target) n.points = target;
  }
}

document.getElementById('btnSave').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'skill-tree.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已下载 skill-tree.json');
});
document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  fileInput.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => importData(rd.result);
  rd.readAsText(f);
});
document.getElementById('btnApply').addEventListener('click', () => importData(jsonView.value));

function importData(text){
  let obj;
  try { obj = JSON.parse(text); }
  catch (e){ toast('JSON 解析失败：' + e.message, 'err'); return; }
  const arr = Array.isArray(obj) ? obj : obj && obj.nodes;
  if (!Array.isArray(arr)){ toast('JSON 格式不正确：需要 nodes 数组', 'err'); return; }
  const out = []; const seen = new Set();
  arr.forEach((raw) => {
    if (!raw || typeof raw !== 'object') return;
    let id = String(raw.id ?? '').trim() || uniqueId('skill');
    while (seen.has(id)) id += '_2';
    seen.add(id);
    const req = Array.isArray(raw.reqSkills) ? raw.reqSkills.map(String)
              : (raw.reqSkills != null ? [String(raw.reqSkills)] : []);
    const n = {
      id,
      name: String(raw.name ?? '未命名'),
      icon: String(raw.icon ?? ''),
      desc: String(raw.desc ?? ''),
      shape: raw.shape === 'circle' ? 'circle' : 'rect',
      reqLevel: clampInt(raw.reqLevel, 0, 99, 0),
      maxLevel: clampInt(raw.maxLevel, 1, 99, 1),
      skip: clampInt(raw.skip, 0, 99, 0),
      autoUnlock: raw.autoUnlock === true,
      reqSkills: [...new Set(req)],
      x: 0,
      y: 0,
      points: Math.max(0, clampInt(raw.points, 0, 999, 0)),
    };
    // 坐标齐全按原坐标吸附，否则放进可视范围内的空位
    const p = (Number.isFinite(+raw.x) && Number.isFinite(+raw.y))
      ? { x: snapGrid(+raw.x), y: snapGrid(+raw.y) }
      : findSpawnSpot(out);
    n.x = p.x;
    n.y = p.y;
    n.points = Math.min(n.points, n.maxLevel);
    out.push(n);
  });
  // 丢弃指向不存在节点（或自身）的前置引用
  for (const n of out)
    n.reqSkills = n.reqSkills.filter(id => id !== n.id && out.some(m => m.id === id));
  // 玩家等级与天赋点池（旧文档缺失时按初始值）
  state.playerLevel = clampInt(obj.playerLevel, 1, 999, 1);
  state.talentPoints = Math.max(0, clampInt(obj.talentPoints, 0, 999, 1));
  state.nodes = out;
  state.selectedId = null;
  refreshAll();
  toast(`已加载 ${out.length} 个技能节点`);
}

// ================= 启动 =================
buildLibrary(); // 控件库不依赖画布尺寸
(function boot(){
  resize(); // 设置画布尺寸（顺带校验布局是否就绪）
  if (stage.getBoundingClientRect().width < 1){
    requestAnimationFrame(boot); // 视口未就绪（嵌入环境首帧布局为 0），等一帧重试
    return;
  }
  seedDemo();
  refreshAll();
})();
})();
